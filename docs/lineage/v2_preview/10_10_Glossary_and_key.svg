<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 950" width="1100" height="950" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5F6C77"/></marker></defs>
<rect width="1100" height="950" fill="#FFFFFF"/>
<rect x="40" y="20" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#B9C5CB"/>
<text x="115.0" y="45.0" font-size="15" font-weight="700" text-anchor="middle" fill="#1E2838">src</text>
<text x="196" y="46" font-size="22" fill="#5F6C77" font-weight="700">›</text>
<rect x="230" y="20" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#B9C5CB"/>
<text x="305.0" y="45.0" font-size="15" font-weight="700" text-anchor="middle" fill="#1E2838">stg</text>
<text x="386" y="46" font-size="22" fill="#5F6C77" font-weight="700">›</text>
<rect x="420" y="20" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#B9C5CB"/>
<text x="495.0" y="45.0" font-size="15" font-weight="700" text-anchor="middle" fill="#1E2838">fct</text>
<text x="576" y="46" font-size="22" fill="#5F6C77" font-weight="700">›</text>
<rect x="610" y="20" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#B9C5CB"/>
<text x="685.0" y="45.0" font-size="15" font-weight="700" text-anchor="middle" fill="#1E2838">dashboard</text>
<text x="40" y="104" font-size="24" fill="#0E4A5C" font-weight="700">Glossary and key</text>
<rect x="40" y="140" width="1020" height="50" fill="#0E4A5C"/>
<text x="50" y="162" font-size="14" font-weight="700" fill="#FFFFFF">Terms</text>
<text x="50" y="180" font-size="10" fill="#E2F2F4">plain definitions</text>
<rect x="40" y="190" width="240" height="40" fill="#FFFFFF" stroke="#B9C5CB"/>
<text x="48" y="214" font-size="12" fill="#1E2838" font-weight="700">src</text>
<rect x="280" y="190" width="780" height="40" fill="#FFFFFF" stroke="#B9C5CB"/>
<text x="288" y="214" font-size="12" fill="#1E2838">A source tab in the APFP Central Administration workbook, where programme staff type the data.</text>
<rect x="40" y="230" width="240" height="40" fill="#FFFFFF" stroke="#B9C5CB"/>
<text x="48" y="254" font-size="12" fill="#1E2838" font-weight="700">stg</text>
<rect x="280" y="230" width="780" height="40" fill="#FFFFFF" stroke="#B9C5CB"/>
<text x="288" y="254" font-size="12" fill="#1E2838">Staging: a cleaned copy of one src tab (clean names, types, one financial-year format). No business logic.</text>
<rect x="40" y="270" width="240" height="40" fill="#FFFFFF" stroke="#B9C5CB"/>
<text x="48" y="294" font-size="12" fill="#1E2838" font-weight="700">fct</text>
<rect x="280" y="270" width="780" height="40" fill="#FFFFFF" stroke="#B9C5CB"/>
<text x="288" y="294" font-size="12" fill="#1E2838">Final: a table built only from stg tables (joins and calculated columns), shaped for the dashboard.</text>
<rect x="40" y="310" width="240" height="40" fill="#FFFFFF" stroke="#B9C5CB"/>
<text x="48" y="334" font-size="12" fill="#1E2838" font-weight="700">No int_ layer</text>
<rect x="280" y="310" width="780" height="40" fill="#FFFFFF" stroke="#B9C5CB"/>
<text x="288" y="334" font-size="12" fill="#1E2838">No intermediate layer: every fct table reads stg directly, so int_ would only copy data.</text>
<rect x="40" y="350" width="240" height="40" fill="#FFFFFF" stroke="#B9C5CB"/>
<text x="48" y="374" font-size="12" fill="#1E2838" font-weight="700">Grain</text>
<rect x="280" y="350" width="780" height="40" fill="#FFFFFF" stroke="#B9C5CB"/>
<text x="288" y="374" font-size="12" fill="#1E2838">What one row means, for example one row per grant.</text>
<rect x="40" y="390" width="240" height="40" fill="#FFFFFF" stroke="#B9C5CB"/>
<text x="48" y="414" font-size="12" fill="#1E2838" font-weight="700">Key column</text>
<rect x="280" y="390" width="780" height="40" fill="#FFFFFF" stroke="#B9C5CB"/>
<text x="288" y="414" font-size="12" fill="#1E2838">A column checked by the cardinality tests (unique, not blank, exists in its parent table); every *_id column.</text>
<rect x="40" y="430" width="240" height="40" fill="#FFFFFF" stroke="#B9C5CB"/>
<text x="48" y="454" font-size="12" fill="#1E2838" font-weight="700">Calculated column (ƒ)</text>
<rect x="280" y="430" width="780" height="40" fill="#FFFFFF" stroke="#B9C5CB"/>
<text x="288" y="454" font-size="12" fill="#1E2838">A column worked out by the scripts from other columns; its inputs are listed under "built from".</text>
<rect x="40" y="470" width="240" height="40" fill="#FFFFFF" stroke="#B9C5CB"/>
<text x="48" y="494" font-size="12" fill="#1E2838" font-weight="700">Dashboard field (metric)</text>
<rect x="280" y="470" width="780" height="40" fill="#FFFFFF" stroke="#B9C5CB"/>
<text x="288" y="494" font-size="12" fill="#1E2838">One Looker Studio field, for example distinct_grantees, reused by every chart that needs it.</text>
<rect x="40" y="510" width="240" height="40" fill="#FFFFFF" stroke="#B9C5CB"/>
<text x="48" y="534" font-size="12" fill="#1E2838" font-weight="700">Chart filter</text>
<rect x="280" y="510" width="780" height="40" fill="#FFFFFF" stroke="#B9C5CB"/>
<text x="288" y="534" font-size="12" fill="#1E2838">The condition a chart adds to a field, for example active grants only.</text>
<rect x="40" y="640" width="400" height="50" fill="#0E4A5C"/>
<text x="50" y="662" font-size="14" font-weight="700" fill="#FFFFFF">Colour key</text>
<text x="50" y="680" font-size="10" fill="#E2F2F4">cells of a table row</text>
<rect x="40" y="690" width="400" height="40" fill="#E1D5E7" stroke="#B9C5CB"/>
<text x="48" y="714" font-size="12" fill="#1E2838">Key column</text>
<rect x="40" y="730" width="400" height="40" fill="#FFF2CC" stroke="#B9C5CB"/>
<text x="48" y="754" font-size="12" fill="#1E2838">Number</text>
<rect x="40" y="770" width="400" height="40" fill="#D5E8D4" stroke="#B9C5CB"/>
<text x="48" y="794" font-size="12" fill="#1E2838">True / false</text>
<rect x="40" y="810" width="400" height="40" fill="#FFFFFF" stroke="#B9C5CB"/>
<text x="48" y="834" font-size="12" fill="#1E2838">Text or date</text>
<rect x="40" y="850" width="400" height="40" fill="#DAE8FC" stroke="#B9C5CB"/>
<text x="48" y="874" font-size="12" fill="#1E2838">Dashboard metric</text>
<rect x="480" y="640" width="300" height="50" fill="#0E4A5C"/>
<text x="490" y="662" font-size="14" font-weight="700" fill="#FFFFFF">Header colour</text>
<text x="490" y="680" font-size="10" fill="#E2F2F4">the layer</text>
<rect x="480" y="690" width="300" height="40" fill="#6B7B86" stroke="#B9C5CB"/>
<text x="488" y="714" font-size="12" fill="#FFFFFF" font-weight="700">src</text>
<rect x="480" y="730" width="300" height="40" fill="#167C88" stroke="#B9C5CB"/>
<text x="488" y="754" font-size="12" fill="#FFFFFF" font-weight="700">stg</text>
<rect x="480" y="770" width="300" height="40" fill="#0E4A5C" stroke="#B9C5CB"/>
<text x="488" y="794" font-size="12" fill="#FFFFFF" font-weight="700">fct</text>
<rect x="480" y="810" width="300" height="40" fill="#3B6BA5" stroke="#B9C5CB"/>
<text x="488" y="834" font-size="12" fill="#FFFFFF" font-weight="700">dashboard</text>
</svg>