<rect x="40" y="896" width="1640" height="212" rx="10" fill="#FFFFFF" stroke="#CBD5DA"/>
<text x="60" y="924" font-size="16" font-weight="700" fill="#0E4A5C">How it runs and how it is checked  (Apps Script, function runCompletePipeline, run by hand)</text>
<rect x="60.0" y="940" width="307.2" height="124" rx="8" fill="#F4F6F9" stroke="#D9E1E5"/>
<text x="72.0" y="962" font-size="13.5" font-weight="700" fill="#1E2838">1  alignTimeZones</text>
<text x="72.0" y="982" font-size="11.5" fill="#5F6C77">pipeline workbook time zone = script</text>
<text x="72.0" y="998" font-size="11.5" fill="#5F6C77">time zone</text>
<text x="368.2" y="1000" font-size="16" fill="#167C88">›</text>
<rect x="383.2" y="940" width="307.2" height="124" rx="8" fill="#F4F6F9" stroke="#D9E1E5"/>
<text x="395.2" y="962" font-size="13.5" font-weight="700" fill="#1E2838">2  Source Header Check</text>
<text x="395.2" y="982" font-size="11.5" fill="#5F6C77">compares source headers with</text>
<text x="395.2" y="998" font-size="11.5" fill="#5F6C77">ref_source_header_baseline; writes</text>
<text x="395.2" y="1014" font-size="11.5" fill="#5F6C77">Source_Header_Audit; stops the run on</text>
<text x="395.2" y="1030" font-size="11.5" fill="#5F6C77">a missing or renamed column and emails</text>
<text x="395.2" y="1046" font-size="11.5" fill="#5F6C77">the owner</text>
<text x="691.4" y="1000" font-size="16" fill="#167C88">›</text>
<rect x="706.4" y="940" width="307.2" height="124" rx="8" fill="#F4F6F9" stroke="#D9E1E5"/>
<text x="718.4" y="962" font-size="13.5" font-weight="700" fill="#1E2838">3  Staging layer</text>
<text x="718.4" y="982" font-size="11.5" fill="#5F6C77">8 build functions: read a source tab,</text>
<text x="718.4" y="998" font-size="11.5" fill="#5F6C77">keep and rename columns, cast types,</text>
<text x="718.4" y="1014" font-size="11.5" fill="#5F6C77">normalise FY to "FY 26-27"</text>
<text x="1014.5999999999999" y="1000" font-size="16" fill="#167C88">›</text>
<rect x="1029.6" y="940" width="307.2" height="124" rx="8" fill="#F4F6F9" stroke="#D9E1E5"/>
<text x="1041.6" y="962" font-size="13.5" font-weight="700" fill="#1E2838">4  Final layer</text>
<text x="1041.6" y="982" font-size="11.5" fill="#5F6C77">6 build functions: fct1, fct2, fct3,</text>
<text x="1041.6" y="998" font-size="11.5" fill="#5F6C77">fct4, fct5, then fct6 (reads fct1)</text>
<text x="1337.8" y="1000" font-size="16" fill="#167C88">›</text>
<rect x="1352.8" y="940" width="307.2" height="124" rx="8" fill="#F4F6F9" stroke="#D9E1E5"/>
<text x="1364.8" y="962" font-size="13.5" font-weight="700" fill="#1E2838">5  Cardinality tests</text>
<text x="1364.8" y="982" font-size="11.5" fill="#5F6C77">key uniqueness, no blank keys, grant</text>
<text x="1364.8" y="998" font-size="11.5" fill="#5F6C77">ids exist in stg_grants; result in</text>
