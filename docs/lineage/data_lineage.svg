<text x="40" y="38" font-size="28" font-weight="700" fill="#FFFFFF">APFP data lineage</text>
<text x="40" y="66" font-size="15" fill="#CFE3E6">APFP Central Administration workbook  →  stg_ (staging)  →  fct_ (final)  →  Looker Studio. No int_ (intermediate) layer: every fct_ table is built directly from stg_ tables.</text>
<rect x="50" y="104" width="300" height="52" rx="8" fill="#167C88"/>
